name: minimall

# 做法 B：数据落在命名卷 mysql_data，平时 restart/up 不丢数据。
# 需要清空测试数据时执行：
#   docker compose -f deployments/docker-compose.yml down -v
#   docker compose -f deployments/docker-compose.yml up -d mysql
# 服务名/端口见 docs/10-deployment.md、docs/14-port-matrix.md
services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: minimall_user
      MYSQL_USER: minimall
      MYSQL_PASSWORD: "123456"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  mysql_data:

networks:
  default:
    name: minimall_net
